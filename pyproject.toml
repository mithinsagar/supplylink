[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "supplylink"
version = "1.0.0"
description = "Multi-source data integration and reconciliation pipeline for supply-chain master data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mithin Sagar S" }]
keywords = ["data-engineering", "data-quality", "reconciliation", "scd2", "data-contracts"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]

dependencies = [
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2.3,<4",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0.2,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<8",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0.12",
  "respx>=0.22,<1",
]

[project.scripts]
supplylink = "supplylink.cli.main:app"

[project.urls]
Homepage = "https://github.com/mithinsagar/supplylink"
Documentation = "https://github.com/mithinsagar/supplylink/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/supplylink"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH", "PTH", "RET", "ARG", "PL", "RUF", "S"]
ignore = [
  "PLR0913",  # many-argument functions are idiomatic for row constructors here
  "S101",     # assert is fine (tests, and internal invariants)
  "RUF012",   # ClassVar annotations not required for simple constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S105", "S106",  # test credentials are literals by necessity
  "PLR2004",       # asserting on a literal expected value is the point of a test
  "ARG001", "ARG002",  # pytest fixtures are often requested for their side effect
  "PLC0415",       # conftest defers application imports until pytest_configure has
                   # set the environment; importing earlier caches the wrong settings
]
"tools/**" = ["S104"]
"migrations/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["supplylink"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime to build validators, so its models'
# annotations must not be hidden behind `if TYPE_CHECKING`.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]
# Plain dataclasses keep annotations as strings under `from __future__ import
# annotations`, so they are not runtime-evaluated and are not listed here.
runtime-evaluated-decorators = ["pydantic.validate_call"]

[tool.mypy]
python_version = "3.11"
files = ["src/supplylink"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: requires a live PostgreSQL database",
  "api: exercises the FastAPI application",
  "slow: long-running test",
]
filterwarnings = ["error::DeprecationWarning:supplylink.*"]

[tool.coverage.run]
source = ["src/supplylink"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
